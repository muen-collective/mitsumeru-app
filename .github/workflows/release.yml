# Release build (Epic 86 T9–T12). Builds, signs, notarizes, gates, publishes.
#
# WHAT THIS RUNNER CAN AND CANNOT BUILD — read before tagging.
#
# It runs `macos-14` and calls `pnpm package:mac`, which packages the host architecture
# only (arm64). **It cannot build the Intel mac target or the Windows installer.** Every
# production release so far (0.2.0 through 0.2.3) was therefore built and published
# LOCALLY with the three-target sequence — `package:mac` (x64 + arm64) →
# `package:win:x64` → `notarize:all` → `PROMOTE=1 check:label` + `verify:release` +
# `verify:artifacts` → upload — and this workflow is the **dev/prerelease** path.
#
# So a tag on an already-published production release must NOT try to create a release
# that exists: the publish step below is idempotent (it uploads with --clobber and
# refreshes the notes from the repository) and it takes the notes from
# `packages/mitsumeru/release-notes/v<version>.md` rather than generating them, so a
# tagged release always carries the notes the repo has. When CI grows a Windows job and
# an Intel mac job, this header and the publish step are what to change together.
#
# The feed is GitHub Releases on THIS repository, and the update client resolves
# its channel from the release tag: `v0.1.0-dev` → channel `dev` → `dev-mac.yml`
# among that release's assets. The tag is therefore not cosmetic — a `-dev`
# build published under a tag without the `dev` prerelease is invisible to every
# dev client. Same rule in reverse for a promoted build, which a `latest`
# channel resolves from this repo's latest non-prerelease release.
#
# Secrets (never the repo):
#   MAC_CERT_P12_BASE64          base64 of the Developer ID Application .p12
#   MAC_CERT_PASSWORD            that .p12's password
#   APPLE_ID                     Apple ID that owns the team
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarytool
#   APPLE_TEAM_ID                4Q6GC57QG4
# An App Store Connect API key would be the better long-term credential (scoped,
# revocable per key); notarize.sh already accepts the three env vars above, so
# this workflow uses the path that exists rather than inventing a second one.
#
# Publishing uploads what notarize.sh produced — it does not build again. The
# order is the point: electron-builder uploads the pre-staple archives if it
# publishes during packaging, which is exactly the defect T10 found in the first
# notarized release (a zip whose app carried no ticket, while spctl still called
# it accepted because it could reach Apple and ask).
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, sign, notarize and gate — but stop before publishing'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # arm64; this build targets arm64 only
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: version + channel
        id: v
        run: |
          VERSION=$(node -p "require('./packages/mitsumeru/package.json').version")
          case "$VERSION" in
            *-dev) CHANNEL=dev ;;
            *)     CHANNEL=latest ;;
          esac
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "release $VERSION (channel $CHANNEL), tag v$VERSION"

      # A temporary keychain per run: the runner is disposable, and a certificate
      # left in the default keychain is a credential in a shared place.
      - name: import the signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mitsumeru.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access and the build hangs
          # until the job times out — the classic empty-diff CI failure.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: package (signed, harness included)
        working-directory: packages/mitsumeru
        run: pnpm package:mac

      - name: notarize + staple (app, then dmg; archives rebuilt from the staple)
        working-directory: packages/mitsumeru
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm notarize

      # The gate, not a formality: it is what caught the pre-staple zip. If this
      # fails, nothing is published.
      - name: release gate
        working-directory: packages/mitsumeru
        run: pnpm verify:release

      - name: labeling gate (-dev until promoted)
        working-directory: packages/mitsumeru
        run: pnpm check:label

      # The smokes drive the packaged app, which needs a window server. GitHub's
      # macOS runners provide one, but this is the first place these three run
      # outside the dev machine — treat a failure here as a real finding about
      # the runner, not as noise to be deleted.
      - name: accept the artifact (packaged-app smokes)
        working-directory: packages/mitsumeru
        run: |
          pnpm smoke
          pnpm smoke:native
          pnpm smoke:updater

      - name: publish to GitHub Releases
        if: ${{ inputs.dry_run != true }}
        working-directory: packages/mitsumeru
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Release notes carry the -dev label (T11): the same suffix on the
          # artifact, the tag and the notes is what makes "internal build" a
          # property of the release rather than a thing people remember.
          #
          # THE NOTES ARE THE REPOSITORY'S, not generated here: `release-notes/v<version>.md`
          # is the file a person reviews and edits, and a tagged release that carried a
          # different paragraph than the repo would be a second source of truth.
          NOTES_FILE="packages/mitsumeru/release-notes/v$VERSION.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "no $NOTES_FILE — the notes are what a release says it contains; write them first" >&2
            exit 1
          fi

          case "$CHANNEL" in
            dev) MODE=--prerelease ;;
            *)   MODE=--latest ;;
          esac

          # IDEMPOTENT ON PURPOSE. A production release is published locally (this runner
          # builds arm64 only — see the header), and the tag that publish creates must not
          # make this workflow fail: it refreshes the notes and uploads its own artifacts
          # over any same-named asset rather than refusing to run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — refreshing its notes and clobbering its assets"
            gh release edit "$TAG" --title "Mitsumeru $VERSION" --notes-file "$NOTES_FILE" $MODE
            gh release upload "$TAG" release/*.dmg release/*.zip release/*-mac.yml --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Mitsumeru $VERSION" \
              --notes-file "$NOTES_FILE" \
              $MODE \
              release/*.dmg release/*.zip release/*-mac.yml
          fi

          echo "published $TAG ($MODE) with $(ls release/*.dmg release/*.zip release/*-mac.yml | wc -l | tr -d ' ') assets"
