<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The loading screen: the surface a person sees before the harness exists.

      It is deliberately self-contained — the typeface is local and nothing is
      fetched. A splash that waits on a network call is a splash that sometimes
      never appears.

      Type: JetBrains Mono (SIL OFL 1.1, see brand/OFL.txt), the monospace the
      harness UI itself reads in — so the splash and the product share one voice.
      Weight 400 body, 500/700 available.

      No mark here (2026-09-11): the app icon already says who this is, in the
      Dock and in the dmg. Repeating it full-size on a screen that is on for a
      second read as a second logo, not as a loading state, and the icons' type
      could not survive the scale anyway. What is left is the only thing the
      screen has to say: that the thing is starting.

      White-label (epic 87, P9d): once the brand store exists, this file reads it
      and shows the client's line instead of ours, before the harness has
      finished booting. Until then it shows ours.

      Copy and type set 2026-09-12 from the designer's Figma frame (1280x769).
      The numbers below are solved against that frame rather than eyeballed —
      size from the cap height of each line, letter-spacing from the measured ink
      width, so the screen reproduces the design instead of resembling it. The
      measurements, all at 1x:

        line 1   ink 177x15px, 20 chars   -> 13.33px + 0.9px spacing
        line 2   ink 136x9px,  29 chars   -> 8.48px - 0.3px spacing
        caret    6x10px, 12px after the text
        field    #000000, no margin; both lines optically centred

      The field is pure black here, not the #191a1a the rest of the chrome uses:
      the frame asks for #000000, and a startup screen that is very slightly off
      its own design is the kind of detail that only shows up in screenshots.
    -->
    <title>Mitsumeru</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./brand/JetBrainsMono-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./brand/JetBrainsMono-Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./brand/JetBrainsMono-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #f2f2f2;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      .stage {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Measured from the frame: 24px of black between the two ink bands, of
           which the descender-less line 1 leaves ~9px inside its own box and
           line 2 leaves ~2px. Kept as one authored value rather than derived,
           because it is the distance the designer placed, not a rhythm. */
        gap: 12px;
        /* The window is dark and empty for a moment; a whisper of motion keeps
           it from reading as a hang. */
        animation: settle 420ms ease-out both;
      }
      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .line {
        font-size: 13.33px;
        letter-spacing: 0.9px;
        color: #f2f2f2;
        white-space: nowrap;
      }
      /* `//` leads the line as decoration, in the same white as the text — the
         frame draws it as part of the line, not as a highlighted prompt. */
      .line .slashes {
        color: #f2f2f2;
      }
      /* The caret is the ONE red thing on the screen, and it blinks. Sized in
         absolute px, not em: the frame's rectangle is 6x10px and it must stay
         6x10 whatever the type does. It sits on the line's cap box, hanging 2px
         below it — which is what vertical-align does here. Verified on the
         capture: 240 red pixels at 2x, exactly 6x10 at 1x. */
      .line .caret {
        display: inline-block;
        width: 6px;
        height: 10px;
        margin-left: 12px;
        background: #ff0000;
        vertical-align: -2px;
        animation: blink 1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .tagline {
        font-size: 8.48px;
        letter-spacing: -0.3px;
        color: #606060;
      }
      /* Respect the system setting: a blinking caret is exactly the kind of
         thing that setting exists for. */
      @media (prefers-reduced-motion: reduce) {
        .stage {
          animation: none;
        }
        .line .caret {
          animation: none;
        }
      }
      /* First-install gate: same stage, two states (direction 2026-10-02). */
      #gate {
        display: none;
      }
      body[data-state="gate"] #splash {
        display: none;
      }
      body[data-state="gate"] #gate {
        display: flex;
      }
      #gate .signin {
        margin-top: 6px;
        font-family: inherit;
        font-size: 13.33px;
        letter-spacing: 0.9px;
        color: #000000;
        background: #f2f2f2;
        border: 0;
        padding: 10px 18px;
        cursor: pointer;
      }
      #gate .signin:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #gate .status {
        font-size: 8.48px;
        letter-spacing: -0.3px;
        color: #606060;
        min-height: 10px;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="splash">
      <p class="line"><span class="slashes">//</span>starting mitsumeru<span class="caret"></span></p>
      <p class="tagline">stare intently at the void...</p>
    </div>

    <div class="stage" id="gate">
      <p class="line"><span class="slashes">//</span>sign in required<span class="caret"></span></p>
      <p class="tagline">mitsumeru starts behind a muen account. free or pro.</p>
      <button class="signin" id="signin" type="button">sign in with browser</button>
      <p class="status" id="gate-status"></p>
    </div>

    <script>
      (function () {
        var api = window.mitsumeru && window.mitsumeru.auth;
        if (!api) return;
        var status = document.getElementById('gate-status');
        var button = document.getElementById('signin');
        function render(user) {
          document.body.dataset.state = user ? 'splash' : 'gate';
        }
        api.user().then(render).catch(function () {});
        api.onAuthChange(render);
        button.addEventListener('click', function () {
          button.disabled = true;
          status.textContent = 'waiting for sign in in your browser...';
          Promise.resolve(api.signIn()).catch(function () {
            button.disabled = false;
            status.textContent = 'could not open the browser. try again.';
          });
          setTimeout(function () {
            button.disabled = false;
          }, 8000);
        });
      })();
    </script>
  </body>
</html>
