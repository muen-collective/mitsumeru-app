# Packaging config for mitsumeru (Epic 86 T9).
#
# Two constraints drive everything here:
#   1. asar: false — the harness is executed by node as a child process, so its
#      files cannot live inside an archive.
#   2. npmRebuild: false — nothing in app/ is native; the harness travels as a
#      resource tree built by scripts/prepare-harness.sh.
appId: com.muen.mitsumeru
productName: Mitsumeru
copyright: Muen

asar: false
npmRebuild: false

directories:
  output: release
  buildResources: build

# app/ carries only our own build output plus the manifest. The trailing
# exclusion matters: the harness is a production dependency (pnpm installs it),
# and without it electron-builder collects that closure a second time into
# Resources/app/node_modules — 168 MB of npm-resolved duplicates next to the
# verified resource tree.
files:
  - out/**/*
  - package.json
  - '!node_modules/**'

# The harness tree lands in Resources/harness/node_modules — where
# src/main/harness.ts looks when app.isPackaged is true. Two entries because
# electron-builder's copy filter drops any relative path that is exactly
# `node_modules` (createFilter treats it as app dependencies), so the from-path
# has to point inside the tree it ships.
extraResources:
  - from: build/harness/node_modules
    to: harness/node_modules
  - from: build/harness/package.json
    to: harness/package.json

# Update feed (T12). electron-builder writes this into the app as
# Contents/Resources/app-update.yml — that file, not this one, is what the
# packaged updater reads. owner/repo must equal UPDATE_OWNER/UPDATE_REPO in
# src/shared/identity.ts, and scripts/check-identity.sh fails the build when the
# two drift; the dev-time override is MITSUMERU_UPDATE_FEED.
#
# GitHub Releases, decided 2026-09-10. There is no `url` to point at, and one
# rule comes with the provider — see identity.ts for the full reasoning: the
# release **tag must carry the channel as its semver prerelease** (`v0.1.0-dev`),
# because that is what the client matches against the entries in
# `releases.atom` before downloading `dev-mac.yml` from that release's assets.
#
# No `channel` here on purpose: electron-builder derives it from the version
# (`appInfo.channel`), so this build writes release/dev-mac.yml and the packaged
# app asks GitHub for the same file, while a promoted `0.1.0` build writes and
# asks for `latest-mac.yml`. That is the same `-dev` suffix that labels artifacts
# and release notes (T11), used a second time as the channel. Measured with
# 0.1.0-dev: release/dev-mac.yml is produced and the packaged
# Resources/app-update.yml carries `channel: dev`.
#
# `releaseType: prerelease`: a dev build belongs in the repository's prerelease
# list, where the update client still sees it (the Atom feed lists prereleases)
# but it never takes the "latest release" slot — that slot belongs to a promoted
# build, which is what a `latest`-channel client resolves against. Nothing
# uploads from here: the package scripts pass --publish never, and CI supplies
# its own token when it publishes.
publish:
  - provider: github
    owner: muen-collective
    repo: mitsumeru
    releaseType: prerelease

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing identity is never written here: electron-builder reads it from the
  # environment or the login keychain (`CSC_NAME`, `CSC_LINK`,
  # `CSC_KEY_PASSWORD`) and fails the build when neither has one. On this rig a
  # single "Developer ID Application" identity is installed, so the check that
  # matters is the one AFTER the build — scripts/verify-release.sh asserts which
  # identity actually signed the artifact.
  #
  # Everything below the app root is signed, including the harness resource:
  # `codesign --timestamp` costs one network round-trip per file and the harness
  # is 24 445 of them, which is why an earlier dev profile skipped it. Measured
  # 2026-09-10 with timestamps on and nothing skipped: 1 m 51 s for the whole
  # `--dir` build, with all 10 Mach-O files inside the harness signed and
  # stamped (the other 24 435 are data, and ship sealed by the outer bundle).
  # So there is no dev-only signing shortcut here any more — a release build and
  # a dev build differ only in version and credentials.
  # Notarization is a separate, explicit step (T10): scripts/notarize.sh submits
  # app + dmg to notarytool and staples both, and scripts/verify-release.sh is
  # what proves it. It is not wired into `mac.notarize` here because the failure
  # mode matters: a build must not depend on credentials a dev machine does not
  # have, and a release must not silently skip the step that makes Gatekeeper
  # accept it.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# The installer is deliberately plain (changed 2026-09-11, user).
dmg:
  title: ${productName} ${version}
  backgroundColor: '#ffffff'
  icon: build/icon.icns
  iconSize: 128
  window:
    width: 660
    height: 420
  contents:
    - x: 168
      y: 300
      type: file
    - x: 492
      y: 300
      type: link
      path: /Applications
